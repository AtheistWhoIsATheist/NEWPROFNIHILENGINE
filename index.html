<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professor Nihil | Ontological Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.addEventListener('DOMContentLoaded', function() {
        if (window.tailwind) {
          tailwind.config = {
            darkMode: 'class',
            theme: {
              extend: {
                colors: {
                  'void': {
                    50: '#f4f4f5', 100: '#e4e4e7', 200: '#d4d4d8', 300: '#a1a1aa',
                    400: '#71717a', 500: '#52525b', 600: '#3f3f46', 700: '#27272a',
                    800: '#141416', 900: '#0a0a0c', 950: '#000000'
                  },
                  neon: {
                    cyan: '#22d3ee', purple: '#a855f7', teal: '#2dd4bf', red: '#f43f5e'
                  },
                  collapse: '#f43f5e', awakening: '#a855f7', integration: '#2dd4bf'
                },
                fontFamily: {
                  mono: ['JetBrains Mono', 'Menlo', 'Monaco', 'Courier New', 'monospace'],
                  sans: ['Inter', 'system-ui', 'sans-serif'],
                  serif: ['Spectral', 'Georgia', 'serif']
                }
              }
            }
          };
        }
      });
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Spectral:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000000;
        color: #e4e4e7;
        margin: 0;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .glass {
        background: rgba(10, 10, 12, 0.7);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .glass-card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.02) 0%, rgba(255, 255, 255, 0) 100%);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.03);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-card:hover {
        border-color: rgba(168, 85, 247, 0.2);
        background: rgba(255, 255, 255, 0.02);
      }
      .cosmic-nebula {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          radial-gradient(circle at 10% 20%, rgba(34, 211, 238, 0.05) 0%, transparent 40%),
          radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.08) 0%, transparent 40%),
          radial-gradient(circle at 50% 50%, rgba(45, 212, 191, 0.03) 0%, transparent 60%);
        pointer-events: none;
        z-index: -1;
      }
      .crt-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                    linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
        background-size: 100% 4px, 3px 100%;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.15;
      }
      .text-glow-purple { text-shadow: 0 0 10px rgba(168, 85, 247, 0.5); }
      .text-glow-cyan { text-shadow: 0 0 10px rgba(34, 211, 238, 0.5); }
      
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #1f1f23; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #a855f7; }

      @keyframes scan {
        from { transform: translateY(-100%); }
        to { transform: translateY(100%); }
      }
      .scan-line {
        position: absolute;
        width: 100%;
        height: 100px;
        background: linear-gradient(0deg, transparent, rgba(34, 211, 238, 0.05), transparent);
        animation: scan 10s linear infinite;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
        "recharts": "https://esm.sh/recharts@^3.7.0",
        "react": "https://esm.sh/react@^19.2.4",
        "react/": "https://esm.sh/react@^19.2.4/",
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div class="cosmic-nebula"></div>
    <div class="crt-overlay"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
